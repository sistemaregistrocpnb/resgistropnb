<style>
:root { --primary: #002b5c; --secondary: #c5a028; --beige-border: #d4c9a8; --success: #15803d; --danger: #dc2626; --info: #1e40af; }
.con-search-box { background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid var(--beige-border); margin-bottom: 20px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
.con-search-field { flex: 1; min-width: 250px; }
.con-search-field label { font-weight: 600; color: var(--primary); display: block; margin-bottom: 6px; font-size: 0.9rem; }
.con-search-field input { width: 100%; padding: 10px; border: 1.5px solid var(--beige-border); border-radius: 5px; font-size: 1rem; box-sizing: border-box; height: 42px; }
.con-search-field small { color: #64748b; font-size: 0.75rem; display: block; margin-top: 4px; }
.con-btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; height: 42px; white-space: nowrap; transition: background 0.2s; }
.con-btn:hover:not(:disabled) { background: var(--secondary); }
.con-btn:disabled { background: #9ca3af; cursor: not-allowed; opacity: 0.6; }
.msg { padding: 10px; margin-top: 12px; border-radius: 5px; text-align: center; display: none; }
.msg.success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
.msg.error { background: #fde2e2; color: #b91c1c; border: 1px solid #fca5a5; }
.msg.info { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }

.ficha-breve { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid var(--primary); }
.ficha-breve-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--beige-border); flex-wrap: wrap; gap: 10px; }
.ficha-breve-header h3 { color: var(--primary); margin: 0; font-size: 1.2rem; }
.estatus-badge { padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; }
.estatus-verificacion { background: #fef3c7; color: #92400e; border: 1px solid #fbbf24; }
.estatus-procesado { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
.estatus-liberado { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
.ficha-breve-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px; }
.ficha-breve-item { background: #f8fafc; padding: 10px; border-radius: 5px; border-left: 3px solid var(--secondary); }
.ficha-breve-item.full-width { grid-column: 1 / -1; }
.ficha-breve-label { font-size: 0.75rem; color: #64748b; font-weight: 600; text-transform: uppercase; margin-bottom: 3px; }
.ficha-breve-value { font-size: 0.95rem; color: #1e293b; font-weight: 500; word-break: break-word; }

.ficha-alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.ficha-alert-delito { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
.ficha-alert-judicial { background: #fef3c7; border: 1px solid #fbbf24; color: #92400e; }

.ficha-breve-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--beige-border); }
.btn-ver-detalles { padding: 10px 20px; background: var(--info); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; }
.btn-ver-detalles:hover { background: #1e3a8a; }
.btn-nueva-incidencia { padding: 10px 20px; background: var(--success); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; }
.btn-nueva-incidencia:hover { background: #166534; }

.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; z-index: 9998; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal-content { background: white; border-radius: 10px; width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.modal-header { background: var(--primary); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 10px 10px 0 0; position: sticky; top: 0; z-index: 10; }
.modal-header h3 { margin: 0; font-size: 1.1rem; }
.modal-close { background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0; width: 30px; height: 30px; line-height: 1; }
.modal-body { padding: 25px; }
.modal-actions { padding: 15px 20px; background: #f8fafc; border-top: 1px solid var(--beige-border); display: flex; gap: 10px; justify-content: flex-end; border-radius: 0 0 10px 10px; position: sticky; bottom: 0; }
.btn-cancel { padding: 12px 24px; background: #64748b; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
.btn-cancel:hover { background: #475569; }
.btn-submit { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
.btn-submit:hover { background: var(--secondary); }
.btn-submit:disabled { background: #9ca3af; cursor: not-allowed; }

.fotos-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
.foto-item { text-align: center; }
.foto-item img { width: 100%; max-height: 200px; object-fit: contain; border: 2px solid var(--beige-border); border-radius: 8px; background: #f8fafc; }
.foto-item-label { margin-top: 8px; font-size: 0.85rem; font-weight: 600; color: var(--primary); }

.incidencias-section { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.incidencias-section h3 { color: var(--primary); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--beige-border); }
.incidencia-item { background: #f8fafc; border-left: 4px solid var(--secondary); padding: 12px 15px; margin-bottom: 10px; border-radius: 5px; }
.incidencia-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
.incidencia-fecha { font-size: 0.8rem; color: #64748b; font-weight: 600; }
.incidencia-autor { font-size: 0.75rem; color: #94a3b8; font-style: italic; }
.incidencia-descripcion { font-size: 0.9rem; color: #1e293b; line-height: 1.5; }
.sin-incidencias { text-align: center; padding: 30px; color: #94a3b8; font-style: italic; }

.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-weight: 600; color: var(--primary); margin-bottom: 6px; font-size: 0.9rem; }
.form-group textarea { width: 100%; padding: 10px; border: 1.5px solid var(--beige-border); border-radius: 5px; font-size: 0.9rem; resize: vertical; min-height: 100px; box-sizing: border-box; }

.ficha-completa-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.ficha-completa-item { background: #f8fafc; padding: 10px; border-radius: 5px; border-left: 3px solid var(--secondary); }
.ficha-completa-item.full-width { grid-column: 1 / -1; }
.ficha-completa-label { font-size: 0.75rem; color: #64748b; font-weight: 600; text-transform: uppercase; margin-bottom: 3px; }
.ficha-completa-value { font-size: 0.95rem; color: #1e293b; font-weight: 500; word-break: break-word; }
.seccion-titulo { color: var(--primary); font-size: 1.1rem; font-weight: 700; margin: 20px 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid var(--beige-border); }
.seccion-titulo:first-child { margin-top: 0; }

/* ✅✅✅ REGLAS DE IMPRESIÓN (HOJA CARTA, SIN CORTES) ✅✅✅ */
@media print {
    @page { size: letter; margin: 1.5cm; }
    body * { visibility: hidden; }
    #cp_modal_detalles, #cp_modal_detalles * { visibility: visible; }
    #cp_modal_detalles { position: absolute; left: 0; top: 0; width: 100%; height: auto; background: white; display: block !important; padding: 0; margin: 0; z-index: 9999; }
    .modal-header, .modal-actions, .modal-close, #cp_btn_imprimir_reporte { display: none !important; }
    .modal-content { box-shadow: none; max-width: 100%; max-height: none; overflow: visible; border: none; }
    .modal-body { padding: 0; }
    .ficha-completa-item, .incidencia-item-print, .fotos-container, .seccion-titulo { page-break-inside: avoid; break-inside: avoid; }
    .seccion-titulo { page-break-after: avoid; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}

@media (max-width: 768px) {
    .con-search-box { flex-direction: column; align-items: stretch; }
    .ficha-breve-grid, .ficha-completa-grid, .fotos-container { grid-template-columns: 1fr; }
    .ficha-breve-actions { flex-direction: column; }
    .ficha-breve-actions button { width: 100%; }
}
</style>

<div class="card">
    <h3>🔍 Consulta de Personas y Vehículos</h3>
    <div class="con-search-box">
        <div class="con-search-field">
            <label>Buscar por Cédula</label>
            <input type="text" id="cp_buscar_cedula" placeholder="Ej: 12345678" inputmode="numeric" pattern="[0-9]*" maxlength="8">
            <small>Ingrese el número de cédula (máximo 8 dígitos)</small>
        </div>
        <button type="button" class="con-btn" id="cp_btn_buscar">🔍 Buscar</button>
    </div>
    <div id="cp_msg" class="msg"></div>
    <div id="cp_ficha_breve" style="display: none;"></div>
    <div id="cp_incidencias_section" style="display: none;"></div>
</div>

<!-- Modal detalles -->
<div class="modal-overlay" id="cp_modal_detalles">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="cp_modal_titulo">📋 Detalles Completos</h3>
            <button class="modal-close" id="cp_modal_close">&times;</button>
        </div>
        <div class="modal-body" id="cp_modal_body"></div>
        <div class="modal-actions">
            <button type="button" class="btn-submit" id="cp_btn_imprimir_reporte" style="background: var(--primary); margin-right: auto;">🖨️ Imprimir Reporte</button>
            <button type="button" class="btn-cancel" id="cp_modal_cerrar">Cerrar</button>
        </div>
    </div>
</div>

<!-- Modal incidencia -->
<div class="modal-overlay" id="cp_modal_incidencia">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h3>➕ Agregar Nueva Incidencia</h3>
            <button class="modal-close" id="cp_modal_inc_close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Descripción de la Incidencia</label>
                <textarea id="cp_incidencia_descripcion" placeholder="Describa la nueva incidencia..."></textarea>
            </div>
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-submit" id="cp_btn_guardar_incidencia">💾 Guardar Incidencia</button>
            <button type="button" class="btn-cancel" id="cp_btn_cancelar_incidencia">Cancelar</button>
        </div>
    </div>
</div>
