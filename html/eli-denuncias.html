<style>
  :root { --primary: #002b5c; --secondary: #c5a028; --beige-border: #d4c9a8; --danger: #dc2626; --danger-hover: #b91c1c; }
  
  /* Caja de búsqueda alineada */
  .eli-search-box { 
    display: flex; 
    gap: 15px; 
    align-items: flex-end;
    background: #f8fafc; 
    padding: 20px; 
    border-radius: 8px; 
    border: 1px solid var(--beige-border); 
    margin-bottom: 10px; 
  }
  .eli-search-box button { 
    padding: 10px 24px; 
    background: var(--primary); 
    color: white; 
    border: none; 
    border-radius: 5px; 
    cursor: pointer; 
    font-weight: 600; 
    height: 42px;
    margin-bottom: 24px;
    white-space: nowrap; 
    transition: background 0.2s; 
  }
  .eli-search-box button:hover { background: var(--secondary); }

  /* Lista de denuncias encontradas */
  .denuncias-lista {
    background: #fff;
    border: 1px solid var(--beige-border);
    border-radius: 8px;
    margin-bottom: 15px;
    display: none;
  }
  .denuncias-lista-header {
    background: var(--primary);
    color: white;
    padding: 12px 16px;
    border-radius: 8px 8px 0 0;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .denuncia-item {
    padding: 14px 16px;
    border-bottom: 1px solid var(--beige-border);
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
  }
  .denuncia-item:hover {
    background: #f0f4f8;
  }
  .denuncia-item:last-child {
    border-bottom: none;
  }
  .denuncia-item-info {
    flex: 1;
  }
  .denuncia-item-numero {
    font-weight: 700;
    color: var(--primary);
    font-size: 1rem;
    margin-bottom: 4px;
  }
  .denuncia-item-detalles {
    font-size: 0.85rem;
    color: #64748b;
    line-height: 1.4;
  }
  .denuncia-item-fecha {
    font-size: 0.85rem;
    color: #475569;
    font-weight: 600;
    white-space: nowrap;
  }
  .denuncia-item-btn {
    padding: 6px 14px;
    background: var(--danger);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .denuncia-item-btn:hover {
    background: var(--danger-hover);
  }

  /* Vista previa de denuncia a eliminar */
  .eli-preview {
    background: #fef2f2;
    border: 2px solid var(--danger);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
    display: none;
  }
  .eli-preview-header {
    background: var(--danger);
    color: white;
    padding: 12px 16px;
    border-radius: 6px 6px 0 0;
    margin: -20px -20px 20px -20px;
    font-weight: 600;
    font-size: 1rem;
  }
  .eli-preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .eli-preview-item {
    background: white;
    padding: 10px;
    border-radius: 4px;
    border: 1px solid #fecaca;
  }
  .eli-preview-label {
    font-size: 0.75rem;
    color: #64748b;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .eli-preview-value {
    font-size: 0.9rem;
    color: #1e293b;
    font-weight: 500;
  }
  .eli-motivo-container {
    margin-top: 20px;
  }
  .eli-motivo-container label {
    display: block;
    font-weight: 600;
    color: var(--danger);
    margin-bottom: 8px;
  }
  .eli-motivo-container textarea {
    width: 100%;
    padding: 10px;
    border: 2px solid var(--danger);
    border-radius: 4px;
    font-size: 0.9rem;
    resize: vertical;
    min-height: 80px;
  }
  .eli-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .eli-btn-cancel {
    flex: 1;
    padding: 12px;
    background: #64748b;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .eli-btn-cancel:hover {
    background: #475569;
  }
  .eli-btn-confirm {
    flex: 1;
    padding: 12px;
    background: var(--danger);
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .eli-btn-confirm:hover {
    background: var(--danger-hover);
  }
  .eli-btn-confirm:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }

  .msg { padding: 10px; margin-top: 12px; border-radius: 5px; text-align: center; display: none; }
  .msg.success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
  .msg.error { background: #fde2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  
  .loading-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0.9); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; backdrop-filter: blur(4px); }
  .loading-overlay.active { display: flex; }
  .spinner { width: 50px; height: 50px; border: 5px solid #e2e8f0; border-top: 5px solid var(--danger); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .loading-text { font-size: 1.1rem; font-weight: 600; color: var(--danger); text-align: center; }
</style>

<div class="card">
  <h3>🗑️ Eliminar Denuncia</h3>
  
  <!-- SECCIÓN DE BÚSQUEDA -->
  <div class="eli-search-box">
    <div style="flex: 1;">
      <label style="font-weight: 600; color: var(--primary); display: block; margin-bottom: 6px;">Cédula del Denunciante</label>
      <input type="text" id="eli_buscar_cedula" placeholder="Ej: V-12345678" style="width: 100%; padding: 10px; border: 1.5px solid var(--beige-border); border-radius: 5px; font-size: 1rem; box-sizing: border-box;">
      <small style="color: #64748b; font-size: 0.8rem; display: block; margin-top: 6px; line-height: 1.3;">
        💡 Debe colocar <strong>V-</strong> o <strong>E-</strong> seguido del número de cédula para buscar la denuncia.
      </small>
    </div>
    <button type="button" id="eli_btn_buscar">🔍 Buscar</button>
  </div>
  <div id="eli_msg_busqueda" class="msg" style="margin-bottom: 15px;"></div>

  <!-- LISTA DE DENUNCIAS ENCONTRADAS -->
  <div id="eli_denuncias_lista" class="denuncias-lista"></div>

  <!-- VISTA PREVIA DE ELIMINACIÓN -->
  <div id="eli_preview_container" class="eli-preview"></div>
</div>

<div id="eli_loading_overlay" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">⏳ Eliminando denuncia...</div>
</div>
