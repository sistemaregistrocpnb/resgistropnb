<style>
  :root { --primary: #002b5c; --secondary: #c5a028; --beige-border: #d4c9a8; --danger: #dc2626; }
  
  .con-search-box {
    background: #f8fafc;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid var(--beige-border);
    margin-bottom: 15px;
    display: flex;
    gap: 15px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .con-search-field {
    flex: 1;
    min-width: 200px;
  }
  .con-search-field label {
    font-weight: 600;
    color: var(--primary);
    display: block;
    margin-bottom: 6px;
    font-size: 0.9rem;
  }
  .con-search-field input {
    width: 100%;
    padding: 10px;
    border: 1.5px solid var(--beige-border);
    border-radius: 5px;
    font-size: 1rem;
    box-sizing: border-box;
  }
  .con-search-field small {
    color: #64748b;
    font-size: 0.75rem;
    display: block;
    margin-top: 4px;
  }
  .con-search-options {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
  }
  .con-search-options input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  .con-search-options label {
    cursor: pointer;
    font-size: 0.85rem;
    color: #475569;
    user-select: none;
  }
  .con-btn {
    padding: 10px 20px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
    height: 42px;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .con-btn:hover:not(:disabled) { background: var(--secondary); }
  .con-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
    opacity: 0.6;
  }
  .con-btn-secondary {
    background: #64748b;
  }
  .con-btn-secondary:hover:not(:disabled) { background: #475569; }

  .con-table-container {
    background: white;
    border: 1px solid var(--beige-border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 15px;
  }
  .con-table-header {
    background: var(--primary);
    color: white;
    padding: 12px 16px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .con-table {
    width: 100%;
    border-collapse: collapse;
  }
  .con-table th {
    background: #f1f5f9;
    padding: 10px 12px;
    text-align: left;
    font-size: 0.8rem;
    color: var(--primary);
    font-weight: 700;
    border-bottom: 2px solid var(--beige-border);
    text-transform: uppercase;
  }
  .con-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #f1f5f9;
    font-size: 0.85rem;
    color: #334155;
  }
  .con-table tr:hover {
    background: #f8fafc;
  }
  .con-table .numero-denuncia {
    font-weight: 700;
    color: var(--primary);
    font-family: monospace;
  }
  .con-table .badge-eliminado {
    background: #fee2e2;
    color: #b91c1c;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    margin-left: 6px;
  }
  .con-table .badge-activo {
    background: #dcfce7;
    color: #15803d;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    margin-left: 6px;
  }
  .con-btn-ver {
    padding: 5px 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .con-btn-ver:hover { background: var(--secondary); }

  .con-pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 15px;
    background: #f8fafc;
    border-top: 1px solid var(--beige-border);
  }
  .con-pagination button {
    padding: 6px 12px;
    background: white;
    border: 1px solid var(--beige-border);
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--primary);
    font-weight: 600;
  }
  .con-pagination button:hover:not(:disabled) {
    background: var(--primary);
    color: white;
  }
  .con-pagination button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .con-pagination button.active {
    background: var(--primary);
    color: white;
  }
  .con-pagination-info {
    font-size: 0.85rem;
    color: #64748b;
    margin: 0 10px;
  }

  .msg { padding: 10px; margin-top: 12px; border-radius: 5px; text-align: center; display: none; }
  .msg.success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
  .msg.error { background: #fde2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  .msg.info { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }

  .con-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9998;
    padding: 20px;
  }
  .con-modal-overlay.active { display: flex; }
  .con-modal {
    background: white;
    border-radius: 10px;
    width: 100%;
    max-width: 900px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .con-modal-header {
    background: var(--primary);
    color: white;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 10px 10px 0 0;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .con-modal-header h3 {
    margin: 0;
    font-size: 1.1rem;
  }
  .con-modal-close {
    background: transparent;
    border: none;
    color: white;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    line-height: 1;
  }
  .con-modal-body {
    padding: 25px;
  }
  .con-modal-actions {
    padding: 15px 20px;
    background: #f8fafc;
    border-top: 1px solid var(--beige-border);
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    border-radius: 0 0 10px 10px;
    position: sticky;
    bottom: 0;
  }
  .con-btn-pdf {
    background: #dc2626;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
  }
  .con-btn-pdf:hover:not(:disabled) { background: #b91c1c; }
  .con-btn-pdf:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }
  .con-btn-print {
    background: var(--primary);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
  }
  .con-btn-print:hover { background: var(--secondary); }

  .ficha-denuncia {
    font-family: Arial, sans-serif;
    color: #1e293b;
    padding: 10px;
  }
  .ficha-header {
    text-align: center;
    border-bottom: 3px solid var(--primary);
    padding-bottom: 15px;
    margin-bottom: 20px;
  }
  .ficha-header h1 {
    color: var(--primary);
    margin: 0 0 5px 0;
    font-size: 1.5rem;
  }
  .ficha-header h2 {
    color: var(--secondary);
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .ficha-header .numero-grande {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--primary);
    margin-top: 10px;
    font-family: monospace;
    letter-spacing: 2px;
  }
  .ficha-section {
    margin-bottom: 20px;
  }
  .ficha-section-title {
    background: var(--primary);
    color: white;
    padding: 8px 12px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 10px;
    border-radius: 4px;
  }
  .ficha-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .ficha-field {
    background: #f8fafc;
    padding: 8px 12px;
    border-left: 3px solid var(--secondary);
    border-radius: 2px;
  }
  .ficha-field.full {
    grid-column: span 2;
  }
  .ficha-label {
    font-size: 0.75rem;
    color: #64748b;
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .ficha-value {
    font-size: 0.95rem;
    color: #1e293b;
    font-weight: 500;
    word-break: break-word;
  }
  .ficha-docs-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .ficha-docs-list li {
    padding: 6px 10px;
    background: #f1f5f9;
    margin-bottom: 4px;
    border-radius: 3px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ficha-docs-list li a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }
  .ficha-docs-list li a:hover {
    text-decoration: underline;
  }
  .ficha-eliminado-aviso {
    background: #fee2e2;
    border: 2px solid var(--danger);
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 15px;
    text-align: center;
  }
  .ficha-eliminado-aviso strong {
    color: var(--danger);
  }

  @media print {
    body * { visibility: hidden; }
    .ficha-denuncia, .ficha-denuncia * { visibility: visible; }
    .ficha-denuncia {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      padding: 20px;
    }
    .con-modal-header, .con-modal-actions { display: none !important; }
    .con-modal-overlay {
      position: static;
      background: white;
      padding: 0;
    }
    .con-modal {
      box-shadow: none;
      max-height: none;
      overflow: visible;
    }
    .ficha-section-title {
      background: var(--primary) !important;
      color: white !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }

  .con-loading {
    text-align: center;
    padding: 40px;
    color: #64748b;
  }
  .con-empty {
    text-align: center;
    padding: 40px;
    color: #94a3b8;
    font-size: 1rem;
  }
</style>

<div class="card">
  <h3>📊 Consulta de Denuncias</h3>
  
  <div class="con-search-box">
    <div class="con-search-field">
      <label> Buscar por Cédula</label>
      <input type="text" id="con_buscar_cedula" placeholder="Ej: V-12345678">
      <small>Deje vacío y presione "Mostrar últimas" para ver las 15 más recientes</small>
    </div>
    <div class="con-search-options">
      <input type="checkbox" id="con_incluir_eliminadas">
      <label for="con_incluir_eliminadas">Incluir denuncias eliminadas</label>
    </div>
    <button type="button" class="con-btn" id="con_btn_buscar">🔍 Buscar</button>
    <button type="button" class="con-btn con-btn-secondary" id="con_btn_ultimas">📋 Últimas 15</button>
  </div>
  
  <div id="con_msg" class="msg"></div>

  <div class="con-table-container">
    <div class="con-table-header">
      <span id="con_table_title">📋 Últimas Denuncias Registradas</span>
      <span id="con_table_count" style="font-size: 0.85rem; font-weight: 400;"></span>
    </div>
    <div id="con_table_content">
      <div class="con-empty">Cargando denuncias...</div>
    </div>
    <div class="con-pagination" id="con_pagination" style="display: none;"></div>
  </div>
</div>

<div class="con-modal-overlay" id="con_modal_overlay">
  <div class="con-modal">
    <div class="con-modal-header">
      <h3 id="con_modal_title">📄 Ficha de Denuncia</h3>
      <button class="con-modal-close" id="con_modal_close">&times;</button>
    </div>
    <div class="con-modal-body">
      <div id="con_ficha_content" class="ficha-denuncia"></div>
    </div>
    <div class="con-modal-actions">
      <button type="button" class="con-btn-print" id="con_btn_print">️ Imprimir</button>
      <button type="button" class="con-btn-pdf" id="con_btn_pdf">📥 Exportar PDF</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
